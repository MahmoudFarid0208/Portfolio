name: Build downloadable CV PDF

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "scripts/build_cv_pdf.py"
      - ".github/workflows/build-cv-pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-cv:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF dependency
        run: python -m pip install reportlab
      - name: Build one-page CV PDF
        run: python scripts/build_cv_pdf.py --output Mahmoud_Farid_CV.pdf
      - name: Commit the generated PDF
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update downloadable CV PDF"
          file_pattern: Mahmoud_Farid_CV.pdf
